<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomocol Lite</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #17201b;
        --panel: #f7f1e6;
        --panel-ink: #243027;
        --line: rgba(255, 255, 255, 0.16);
        --accent: #7cc7a1;
        --accent-strong: #f2bd65;
        --muted: #b6c4ba;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0)),
          var(--bg);
        color: white;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      header {
        min-height: 64px;
        padding: 12px clamp(14px, 3vw, 34px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.1rem, 2.2vw, 1.7rem);
        font-weight: 750;
        letter-spacing: 0;
      }

      .status {
        color: var(--muted);
        font-size: 0.9rem;
        white-space: nowrap;
      }

      main {
        width: min(100%, 1360px);
        margin: 0 auto;
        padding: clamp(12px, 2.5vw, 28px);
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        gap: 14px;
      }

      .game-shell {
        min-height: 0;
        border: 1px solid var(--line);
        background: #050705;
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.34);
        overflow: hidden;
        aspect-ratio: 16 / 9;
        max-height: calc(100vh - 150px);
        width: 100%;
        justify-self: center;
      }

      .game-shell:fullscreen {
        width: 100vw;
        height: 100vh;
        max-height: none;
        border: 0;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: black;
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .buttons {
        display: flex;
        gap: 10px;
      }

      button,
      a.button {
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.08);
        color: white;
        font: inherit;
        font-weight: 650;
        text-decoration: none;
        cursor: pointer;
      }

      button:hover,
      a.button:hover {
        border-color: var(--accent);
        background: rgba(124, 199, 161, 0.16);
      }

      button.primary {
        background: var(--accent-strong);
        border-color: var(--accent-strong);
        color: #251b0a;
      }

      @media (max-width: 720px) {
        header,
        .controls {
          align-items: flex-start;
          flex-direction: column;
        }

        .game-shell {
          max-height: none;
        }

        .buttons {
          width: 100%;
        }

        button,
        a.button {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Tomocol Lite</h1>
      <div class="status">Godot Web prototype</div>
    </header>

    <main>
      <section class="game-shell" id="game-shell" aria-label="Tomocol Lite game">
        <iframe id="game-frame" src="game.html" title="Tomocol Lite" allowfullscreen></iframe>
      </section>

      <div class="controls">
        <div>画面をクリックしてから操作できます。WASD / 矢印キーで移動、E で出入り。</div>
        <div class="buttons">
          <a class="button" href="game.html">直接開く</a>
          <button class="primary" id="fullscreen-button" type="button">全画面</button>
        </div>
      </div>
    </main>

    <script>
      const gameShell = document.getElementById("game-shell");
      const gameFrame = document.getElementById("game-frame");
      const fullscreenButton = document.getElementById("fullscreen-button");

      gameFrame.addEventListener("mouseenter", () => {
        gameFrame.focus();
      });

      fullscreenButton.addEventListener("click", async () => {
        if (gameShell.requestFullscreen) {
          await gameShell.requestFullscreen();
          gameFrame.focus();
        }
      });
    </script>
  </body>
</html>
